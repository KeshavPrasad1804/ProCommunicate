name: ProCommunicate

options:
  bundleIdPrefix: dev.procommunicate
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  ArgmaxOSS:
    # WhisperKit (on-device speech recognition on the Neural Engine). Repo moved from argmaxinc/WhisperKit.
    url: https://github.com/argmaxinc/argmax-oss-swift
    exactVersion: 1.1.1

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Keshav Prasad (Personal Team), free Apple ID: installs on the iPhone last 7 days.
    DEVELOPMENT_TEAM: 7GQSGXHXGB

targets:
  ProCommunicate:
    type: application
    platform: iOS
    sources:
      - path: ProCommunicate
        excludes:
          - Resources/content
      # Copied as a folder so paths like content/ta-en/course.json are kept in the app bundle.
      - path: ProCommunicate/Resources/content
        type: folder
        buildPhase: resources
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
    info:
      path: ProCommunicate/Info.plist
      properties:
        # Static launch screen = the first frame of the animated intro (SplashView).
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.procommunicate.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ProCommunicate
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "ProCommunicate records your voice so you can practise speaking and get feedback. Recordings stay on your iPhone."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        # llama.cpp ships for real iPhones only (no Simulator slice), so it is linked for device builds
        # only and the Swift code uses `#if canImport(llama)`. Fetch it with: sh tools/fetch-llama.sh
        "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]": "$(inherited) $(PROJECT_DIR)/Vendor/llama.xcframework/ios-arm64"
        "OTHER_LDFLAGS[sdk=iphoneos*]": "$(inherited) -framework llama"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Embed llama.framework (device builds)
        basedOnDependencyAnalysis: false
        script: |
          if [ "$PLATFORM_NAME" = "iphoneos" ]; then
            SRC="$PROJECT_DIR/Vendor/llama.xcframework/ios-arm64/llama.framework"
            DEST="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
            mkdir -p "$DEST"
            rm -rf "$DEST/llama.framework"
            cp -R "$SRC" "$DEST/"
            if [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
              codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --preserve-metadata=identifier,entitlements "$DEST/llama.framework"
            fi
          fi

  ProCommunicateTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ProCommunicateTests
    dependencies:
      - target: ProCommunicate
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.procommunicate.app.tests

schemes:
  ProCommunicate:
    build:
      targets:
        ProCommunicate: all
        ProCommunicateTests: [test]
    test:
      targets:
        - ProCommunicateTests
      gatherCoverageData: false
